name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Python ${{ matrix.python }}
        run: uv python install
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Check code formatting
        run: uv run --no-sync poe format-check
      - name: Run Ruff lint
        run: uv run --no-sync poe lint
      - name: Run strict Pyright
        run: uv run --no-sync poe typecheck
      - name: Run tests with coverage
        run: uv run --no-sync poe test
      - name: Run examples
        run: uv run --no-sync poe example
      - name: Build wheel and sdist
        run: uv run --no-sync poe build
      - name: Verify artifacts and isolated installation
        run: uv run --no-sync poe check-dist
      - name: Report model and adaptation microbenchmarks
        if: runner.os == 'Linux'
        run: uv run --no-sync poe benchmark
