name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run workflow security checks
        run: uv run --no-sync poe workflow-security
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  check:
    name: Check (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Python ${{ matrix.python }}
        run: uv python install
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Check code formatting
        run: uv run --no-sync poe format-check
      - name: Run Ruff lint
        run: uv run --no-sync poe lint
      - name: Run strict Pyright
        run: uv run --no-sync poe typecheck
      - name: Run tests with coverage
        run: uv run --no-sync poe test
      - name: Run examples
        run: uv run --no-sync poe example
      - name: Build wheel and sdist
        run: uv run --no-sync poe build
      - name: Verify artifacts and isolated installation
        run: uv run --no-sync poe check-dist
