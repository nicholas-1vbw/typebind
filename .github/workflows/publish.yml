name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Check artifacts only or rehearse on TestPyPI
        type: choice
        options: [check, testpypi]
        default: check
        required: true
      version:
        description: Full version (required for TestPyPI; optional for check), e.g. 0.1.0.dev1
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Full release checks
    if: github.event_name != 'push' || github.event.deleted == false
    # actionlint 1.7.12 rejects $/; this local call still uses the caller commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: Build release artifacts
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      devrelease: ${{ steps.release.outputs.devrelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Validate candidate and prepare the build checkout version
        id: release
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --no-sync python scripts/check_release.py
      - name: Build wheel and sdist
        run: uv run --no-sync poe build --out-dir dist/release
      - name: Verify release artifacts and isolated installation
        run: uv run --no-sync poe check-dist --dist-dir dist/release --expected-version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
      - name: Store only the verified distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # Serialize uploads of this version without blocking other versions or PyPI.
    concurrency:
      group: publish-testpypi-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    environment:
      name: testpypi
      url: https://test.pypi.org/p/typebind
    permissions:
      id-token: write # Required for this upload job to authenticate through OIDC.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Repeated rehearsals may encounter the same version. Verification below
          # must still download a wheel with exactly the candidate's SHA256.
          skip-existing: true

  verify-testpypi:
    name: Verify installation from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
          merge-multiple: true
      - name: Install the hash-checked index wheel and run isolated examples
        run: >-
          uv run --no-sync poe check-dist --dist-dir dist/release
          --index-url https://test.pypi.org/simple/ --expected-version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}

  pypi:
    name: Upload verified artifacts to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-pypi-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/typebind
    permissions:
      id-token: write # Required for this upload job to authenticate through OIDC.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify-pypi:
    name: Verify installation from PyPI
    needs: [build, pypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
          merge-multiple: true
      - name: Install the hash-checked index wheel and run isolated examples
        run: >-
          uv run --no-sync poe check-dist --dist-dir dist/release
          --index-url https://pypi.org/simple/ --expected-version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}

  github-release:
    name: Create GitHub Release after PyPI verification
    needs: [build, verify-pypi]
    if: needs.build.outputs.devrelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Only this job may create the release and attach distributions.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Create release with verified distributions and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          --verify-tag --generate-notes --title "$RELEASE_TAG"
          --prerelease="$PRERELEASE"
