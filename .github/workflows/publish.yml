name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Check artifacts only, rehearse on TestPyPI, or publish directly to PyPI
        type: choice
        options: [check, testpypi, pypi]
        default: check
        required: true

permissions:
  contents: read

# Do not interrupt an upload or allow concurrent releases to the same indexes.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Full release checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    needs: check
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Verify release tag, version and main ancestry
        if: inputs.target != 'check'
        run: uv run --no-sync python scripts/check_release.py
      - name: Build wheel and sdist
        run: uv run --no-sync poe build --out-dir dist/release
      - name: Verify release artifacts and isolated installation
        run: uv run --no-sync poe check-dist --dist-dir dist/release
      - name: Store only the verified distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  testpypi:
    name: Upload to TestPyPI
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/typebind
    permissions:
      id-token: write # Required for this upload job to authenticate through OIDC.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Repeated rehearsals may encounter the same version. Verification below
          # must still download a wheel with exactly the candidate's SHA256.
          skip-existing: true

  verify-testpypi:
    name: Verify installation from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
          merge-multiple: true
      - name: Install the hash-checked index wheel and run isolated examples
        run: >-
          uv run --no-sync poe check-dist --dist-dir dist/release
          --index-url https://test.pypi.org/simple/

  pypi:
    name: Upload verified artifacts to PyPI
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/typebind
    permissions:
      id-token: write # Required for this upload job to authenticate through OIDC.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-pypi:
    name: Verify installation from PyPI
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
          merge-multiple: true
      - name: Install the hash-checked index wheel and run isolated examples
        run: >-
          uv run --no-sync poe check-dist --dist-dir dist/release
          --index-url https://pypi.org/simple/
