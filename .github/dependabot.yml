version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
# Python updates remain manual until the hosted updater supports the project's uv range.
# See CONTRIBUTING.md; do not weaken required-version to accommodate the bot.
